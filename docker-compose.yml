services:
  canteen-mcp:
    image: ghcr.io/zahraabouzeid/canteen-mcp:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web

networks:
  web:
    external: true
